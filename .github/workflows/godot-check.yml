name: Godot 4.7.2 validation

on:
  push:
    branches: [main, rebuild/halo-inspired-fps-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: godot-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Import project
        run: godot --headless --editor --path Grimholt --quit

      - name: Parse every GDScript file
        run: godot --headless --path Grimholt --script res://tests/script_validation_test.gd

      - name: Headless startup smoke test
        run: godot --headless --path Grimholt --quit-after 10

      - name: Modular FPS gameplay smoke test
        run: godot --headless --path Grimholt --script res://tests/fps_foundation_smoke_test.gd
