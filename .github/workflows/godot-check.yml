name: Godot project checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: godot-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Import and parse project
        run: godot --headless --editor --path Grimholt --quit

      - name: Headless startup smoke test
        run: godot --headless --path Grimholt --quit-after 10

      - name: Gameplay systems regression test
        run: godot --headless --path Grimholt --script res://tests/gameplay_systems_test.gd

      - name: Player movement and terrain collision regression test
        run: godot --headless --path Grimholt --script res://tests/player_physics_test.gd

      - name: Editable scene hierarchy regression test
        run: godot --headless --path Grimholt --script res://tests/scene_structure_test.gd

      - name: Extended gameplay and world-scale regression test
        run: godot --headless --path Grimholt --script res://tests/extended_gameplay_test.gd
