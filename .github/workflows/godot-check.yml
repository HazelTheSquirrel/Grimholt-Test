name: Godot 4.7.2 validation

on:
  push:
    branches: [main, hardening/godot-4.7.2-stability]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: godot-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Import project
        run: godot --headless --editor --path Grimholt --quit

      - name: Parse every GDScript file
        run: godot --headless --path Grimholt --script res://tests/script_validation_test.gd

      - name: Headless startup smoke test
        run: godot --headless --path Grimholt --quit-after 10

      - name: Shooter gameplay smoke test
        run: godot --headless --path Grimholt --script res://tests/shooter_smoke_test.gd
